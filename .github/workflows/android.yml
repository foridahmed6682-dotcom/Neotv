name: Android CI Build & Auto Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Build with Gradle assembler
      run: gradle assembleDebug --no-daemon --stacktrace

    - name: Verify APK Generation
      run: |
        ls -la app/build/outputs/apk/debug/

    - name: Rename APK to release-apk.apk
      run: |
        mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/release-apk.apk

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: app/build/outputs/apk/debug/release-apk.apk

    - name: Automatic Production GitHub Release
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Slate IPTV Release v1.0.${{ github.run_number }}
        body: |
          ### Slate IPTV Production Build
          This APK carries high-performance connection auto-healing, speed-prioritized list sorting, and automatic responsive category filters.

          #### 📥 Direct Download Link:
          Click the following link to instantly download the APK file on your device:
          **[Direct Download release-apk.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}/release-apk.apk)**
        draft: false
        prerelease: false
        files: app/build/outputs/apk/debug/release-apk.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
